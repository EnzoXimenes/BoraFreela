<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favcon.png">
    <title>BoraFreela</title>
    <link rel="stylesheet" href="Style.css">
    
    <style>
        :root {
            --azul-escuro: #290a80;
            --laranja: #FF6B00;
            --branco: #FFFFFF;
            --background-azul: #3c2d4b;
        }
        body {
        font-family: 'Comfortaa-light', sans-serif;
        background: #FFFFFF;
        background-image: url(assets/images/bannerprincipal.png);
        background-size: contain;
        background-position: 50vw center;
        background-repeat: no-repeat;
        min-height: 100vh;
        }

        header{
            display: flex;
            align-items: center;/* Mantem logo e barra na mesma altura */
            justify-content: flex-start; /* Alinha tudo comecando da esquerda */
            gap: 20px;/* Define a distancia exata entre o logo e os links (muda o nemero se quiser mais perto/longe) */
            padding: 0 5%;  /*No lugaar do 0 define a distancia da parte de cima do site, e a % define a posicaoo comecando da esquerda*/   
        }

        .logo-container {
            width: 120px;
            height: auto;
            align-items: center; /*Alinhar itens*/
            display: flex;
        }
        .logo-container img {
            width: 100%;
            height: auto;
        }
       .navegate {
            z-index: 99px; /*profundidade do elemento*/
            list-style: none; /*tira qualquer decoração do texto*/
            display: inline-flex; /*Alinha os links */
            padding: 15px 30px;/* O primeiro numero aumenta em cima/baixo. O segundo nas laterais */
            background-color: #290a80;
            border-radius: 20px;/*Deixa a borda mais arredondada*/
        }
        li {
            display: inline-flex;
        }
        details {
            position: relative; /*Posicionado em relação ao elemento pai*/
        }        
        .user-btn {
            width: 100px; /*largura do elemento*/
            display: flex; /*elemento flexivel*/
            align-items: center; /*alinha os elementos filho*/
            list-style: none; /*Exclui a linha do texto*/
            flex-direction: row; /*Muda a direção do conteudo do elemento*/
            color: #FFFFFF;
            cursor: pointer;
        }
        .info-btn-desktop {
            width: 160px;
            display: flex; /*elemento flexivel*/
            align-items: center; /*alinha os elementos filho*/
            list-style: none; /*Exclui a linha do texto*/
            flex-direction: row; /*Muda a direção do conteudo do elemento*/
            color: #FFFFFF;
            cursor: pointer; /*Muda o icone do cursor*/
            gap: 8px;
        }
        .info-btn-mobile {
            display: none;
        }
        .login-btn {
            color: var(--branco);
            display: flex;
            align-items: center;
            gap: 8px; /*espaçamento entre os elementos*/
        }
        .icon {
            width: 30px; /*Largura*/
            height: auto; /*Altura é redimensionada automaticamente em relação a largura*/
        }
        .user-drop {
            background-color: var(--azul-escuro);
            position: absolute; /*Posição em relação ao elemento pai*/
            padding: 8px;
            display: flex; /*Lista*/
            flex-direction: column; /*Estilo da lista*/
            border-radius: 10px; /*Suaviza a borda*/
            gap: 10px;
            }
        .drop-links {
            color: var(--branco);
        }
        a {
            text-decoration: none;
        }
        .userIcon {
            width: 25px;
            height: auto;
        }
        .texto-principal{
            font-size: 42px; /*Tamanho da fonte*/
            text-align: start; /*alinhamento*/
        }     
        .destaque-laranja{
             color: var(--laranja);
             font-weight: 700;
        }
        .destaque-azul{
            color: #19429a;
            font-weight: 700;
        }
        .theme-btn {
            color: #FFFFFF;
            font-size: 30px;
        }
        @media (max-width: 768px) {
            body {
                background-image: none;
            }
            .navegate {
                font-size: 1rem;
                position: fixed;
                display: flex;
                justify-content: flex-start;
                bottom: 1rem;
                left: 1rem;
                right: 1rem;
            }
            .user-drop {
                top: auto;
                bottom: 100%;
                flex-direction: column-reverse;
            }
            .info-btn-mobile {
                width: 25px;
                display: flex;
            }
            .info-btn-desktop {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header> 
        <div class="logo-container">
            <img src="assets/images/BoraFreela2.png" alt="BoraFreela">
        </div>

        <a class="info-btn-mobile" href="comofunciona.html">
            <img class="userIcon" src="assets/images/infoblack.png">
        </a>
        
        <nav>
            <ul class="navegate">
                <details>
                    <!--BOTÃO DA GAVETA USUARIO-->
                    <summary class="user-btn">
                        <img class="icon" src="assets/images/user.png">
                        <span>Usuário</span>
                    </summary>
                        
                    <!--GAVETA DO BOTÃO DO USUARIO-->
                    <div class="user-drop">
                        <a class="drop-links" href="profile.html">Perfil</a>
                        <a class="drop-links" href="login.html">login</a>
                        <a class="drop-links" href="cadastro.html">Sign up</a>
                        <a class="login-btn" href="login.html">
                            <span>Entrar</span>
                            <img class="userIcon" src="assets/images/logout.png">
                        </a>
                    </div>    
                </details>

                <li>    <!--LINKS DA NAV BAR-->
                    <a class="info-btn-desktop" href="comofunciona.html">
                        <img class="icon" src="assets/images/info.png">
                        <span class="info-txt">Como funciona</span>

                    <a class="explorar" href="explorar.html">
                        <img class="icon" src="assets/images/search.png">
                    </a>

                    <label for="theme-toggle" class="theme-btn">
                        <span class="theme-icon">☀️</span>
                        <span class="theme-icon">🌙</span>
                    </label>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <div class="banner-principal">
            <h1 class="texto-principal">Conectando <span class="destaque-laranja">talentos</span> a <span class="destaque-azul">oportunidades</span>.</h1>
            </div>
        </section>
    </main>

    <footer>

    </footer>
</body>
</html>
